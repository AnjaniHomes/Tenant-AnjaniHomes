              <script>
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                const currentDate = new Date();
                let currentYear = currentDate.getFullYear();
                let currentMonth = months[currentDate.getMonth()];

                // Check if it's past the 1st day of the current month or it's December
                if (currentDate.getDate() > 3) {
                  // Increment the month index and handle the wrap-around to January of the next year
                  currentMonth = months[(currentDate.getMonth() + 1) % 12];
                  if (currentDate.getMonth() === 11) {
                    currentYear += 1;
                  }
                }

                document.write(currentMonth + " " + currentYear);
              </script>
